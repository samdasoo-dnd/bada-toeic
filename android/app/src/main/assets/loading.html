<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04121c">
<title>바다토익</title>
<style>
  :root{
    --ink:#eaf6ff;
    --teal:#39e6d0;
    --blue:#38b6ff;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%; overflow:hidden; background:#04121c;
  }
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
  }

  /* ---------- 1. 윤슬 바다 (WebGL 셰이더 / Canvas 2D 폴백) ---------- */
  #sea{
    position:fixed; inset:0; display:block;
    width:100%; height:100%;
    background:linear-gradient(180deg,#1d85b8 0%,#0e5a8a 46%,#072b4d 100%);
  }
  /* 가독성용 베일 — 위는 살짝, 아래는 문구가 읽히도록 */
  .veil{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    background:
      radial-gradient(105% 46% at 50% 40%, rgba(3,16,28,.10) 0%, rgba(3,16,28,.42) 62%, rgba(3,16,28,.10) 100%),
      linear-gradient(180deg, rgba(3,14,26,.34) 0%, rgba(3,14,26,.04) 22%, rgba(3,14,26,0) 46%, rgba(2,12,22,.58) 78%, rgba(2,12,22,.86) 100%);
  }

  /* ---------- 2. 순백 로고 (아래에서 60% 지점 = 화면 위에서 40%) ---------- */
  .logo{
    position:fixed; left:0; right:0; top:40%; z-index:3;
    transform:translateY(-50%);
    text-align:center; pointer-events:none;
    animation:logoIn .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes logoIn{
    from{ opacity:0; transform:translateY(calc(-50% + 22px)) scale(.96); }
    to{ opacity:1; transform:translateY(-50%); }
  }
  .logo::before{
    content:""; position:absolute; left:50%; top:50%; z-index:-1;
    width:150%; height:220%; transform:translate(-50%,-50%);
    pointer-events:none;
    background:radial-gradient(closest-side, rgba(2,18,34,.72) 0%, rgba(2,18,34,.42) 46%, transparent 78%);
  }
  .logo h1{
    margin:0;
    font-size:clamp(42px, 12vw, 68px);
    font-weight:900;
    letter-spacing:-.045em;
    color:#ffffff;
    -webkit-text-fill-color:#ffffff;
    text-shadow:
      0 2px 10px rgba(0,12,24,.62),
      0 8px 34px rgba(0,16,32,.48),
      0 0 2px rgba(255,255,255,.85),
      0 0 30px rgba(198,240,255,.30);
  }
  .logo p{
    margin:10px 0 0;
    font-size:clamp(10px, 2.6vw, 13px);
    font-weight:700;
    letter-spacing:.44em;
    text-indent:.44em;
    color:rgba(214,240,252,.88);
    text-shadow:0 1px 8px rgba(0,14,28,.6);
  }

  /* ---------- 3. 하단 안내 문구 + 파도 로딩바 ---------- */
  .foot{
    position:fixed; left:0; right:0; z-index:4;
    bottom:calc(9% + var(--safe-b));
    display:flex; flex-direction:column; align-items:center;
    gap:18px; padding:0 6vw;
  }
  .msg-wrap{
    height:1.6em; display:flex; align-items:center; justify-content:center;
    width:100%; overflow:hidden;
  }
  .msg{
    margin:0; white-space:nowrap;
    font-size:clamp(13.5px, 3.9vw, 17px);
    font-weight:700;
    letter-spacing:-.01em;
    color:rgba(234,247,255,.95);
    text-shadow:0 1px 10px rgba(0,16,30,.7), 0 0 22px rgba(0,20,36,.45);
    opacity:1; transform:translateY(0);
    transition:opacity .5s ease, transform .5s ease;
    will-change:opacity;
  }
  .msg.is-out{ opacity:0; transform:translateY(5px); }

  .bar{
    position:relative;
    width:min(520px, 80vw);
    height:15px;
    filter:drop-shadow(0 0 12px rgba(57,230,208,.28));
  }
  .bar canvas{ display:block; width:100%; height:100%; }

  @media (prefers-reduced-motion: reduce){
    .logo{ animation-duration:.01s; }
    .msg{ transition-duration:.01s; }
  }
</style>
</head>
<body>

<canvas id="sea" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<div class="logo" role="img" aria-label="바다토익">
  <h1>바다토익</h1>
  <p>BADA TOEIC</p>
</div>

<div class="foot">
  <div class="msg-wrap">
    <p class="msg" id="msg" role="status" aria-live="polite">토익의 바다로 들어가는 중...</p>
  </div>
  <div class="bar">
    <canvas id="wave" aria-hidden="true"></canvas>
  </div>
</div>

<script>
(function () {
  "use strict";

  var MSGS = [
    "토익의 바다로 들어가는 중...",
    "단어 파도를 타는 중...",
    "문법 암초를 피해 항해하는 중...",
    "리스닝 물결에 귀 기울이는 중...",
    "만점 등대에 거의 다 왔어요!"
  ];
  var MSG_INTERVAL = 5000;   // 5초마다 부드럽게 페이드 전환
  var MSG_FADE = 520;        // 페이드 아웃 시간
  var FILL_MS = 45000;       // 서버가 깨어나기 전 92%까지 차오르는 기준 시간
  var FILL_MAX = 0.92;
  var FINISH_MS = 400;       // finishLoading() → 100%까지 0.4초

  /* ============================================================
     윤슬 셰이더 (frontend/splash.js 의 WebGL 셰이더 그대로)
     ============================================================ */
  var VERT = [
    "attribute vec2 a_pos;",
    "void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }"
  ].join("\n");

  var FRAG = [
    "precision highp float;",
    "uniform vec2 u_res;",
    "uniform float u_time;",
    "",
    "float hash(vec2 p){",
    "  p = fract(p * vec2(123.34, 456.21));",
    "  p += dot(p, p + 45.32);",
    "  return fract(p.x * p.y);",
    "}",
    "float noise(vec2 p){",
    "  vec2 i = floor(p), f = fract(p);",
    "  vec2 u = f * f * (3.0 - 2.0 * f);",
    "  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),",
    "             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);",
    "}",
    "float fbm2(vec2 p){",
    "  float v = 0.0, a = 0.58;",
    "  for (int i = 0; i < 2; i++) { v += a * noise(p); p = p * 2.07 + 5.3; a *= 0.48; }",
    "  return v;",
    "}",
    "// 가로로 길게 늘어진 잔물결 높이 (x는 느리게, y는 촘촘하게)",
    "float ripple(vec2 p){",
    "  return 0.58 * noise(p)",
    "       + 0.28 * noise(p * vec2(2.1, 2.6) + 7.3)",
    "       + 0.14 * noise(p * vec2(3.9, 5.4) + 2.1);",
    "}",
    "",
    "void main(){",
    "  vec2 uv = gl_FragCoord.xy / u_res;",
    "  float aspect = u_res.x / u_res.y;",
    "  float t = u_time;",
    "  float px = uv.x * aspect;",
    "",
    "  // ---- 원근: 위(먼 곳)는 촘촘하고, 아래(가까운 곳)는 넓게 ----",
    "  float py = pow(clamp(uv.y, 0.0, 1.0) + 0.012, 0.60);",
    "  float flow = t * 0.85;",
    "  vec2 p = vec2(px * 1.5 + sin(uv.y * 3.0 + t * 0.18) * 0.07, py * 38.0 + flow);",
    "",
    "  // ---- 잔물결 높이장 + 가로 능선 ----",
    "  float h = ripple(p);",
    "  float band = sin((p.y + flow * 0.9) * 2.9 + h * 2.6);",
    "  float hn = clamp(h * 0.98 + 0.055 * band, 0.0, 1.0);",
    "  float crest = smoothstep(0.60, 0.90, hn);",
    "",
    "  // ---- 바닷물 색: #072b4d ~ #0e5a8a ~ #1d85b8 ----",
    "  vec3 cDeep = vec3(0.024, 0.165, 0.290);",
    "  vec3 cMid  = vec3(0.055, 0.353, 0.541);",
    "  vec3 cLite = vec3(0.114, 0.522, 0.722);",
    "  vec3 col = mix(cMid, cDeep, smoothstep(0.10, 0.98, uv.y));",
    "  col += cLite * 0.20 * smoothstep(0.34, 0.0, uv.y);",   // 위쪽 하늘 반사
    "  col = mix(col, cLite * 1.22, crest * 0.38);",           // 능선 밝게
    "  col *= 0.82 + 0.34 * hn;",                              // 골은 어둡게
    "  float lineHi = pow(0.5 + 0.5 * band, 11.0);",
    "  col += cLite * lineHi * 0.18;",
    "  col *= 1.0 - 0.20 * pow(0.5 - 0.5 * band, 3.0);",   // 골에 생기는 어두운 잔물결 선                          // 가로 물빛 선
    "",
    "  // ---- 중앙 윤슬 빛기둥 ----",
    "  float cx = uv.x - 0.5 + 0.016 * sin(uv.y * 11.0 + t * 0.9 + h * 3.0);",
    "  float cw = mix(0.062, 0.155, smoothstep(0.05, 0.9, uv.y));",
    "  float column = exp(-(cx * cx) / (2.0 * cw * cw));",
    "  column *= smoothstep(0.02, 0.10, uv.y) * (1.0 - 0.45 * smoothstep(0.80, 1.0, uv.y));",
    "",
    "  // ---- 물결 법선 → 날카로운 스페큘러 ----",
    "  float e = 0.045;",
    "  vec2 pn = vec2(px * 6.5, py * 60.0 + flow * 1.3);",
    "  float sy = noise(pn + vec2(0.0, e)) - noise(pn - vec2(0.0, e));",
    "  float sx = noise(pn + vec2(e * 2.0, 0.0)) - noise(pn - vec2(e * 2.0, 0.0));",
    "  vec3 n = normalize(vec3(-sx * 9.0, -sy * 14.0, 1.0));",
    "  vec3 Ld = normalize(vec3(0.0, 0.80, 0.60));",
    "  vec3 H = normalize(Ld + vec3(0.0, 0.0, 1.0));",
    "  float spec = pow(max(dot(n, H), 0.0), 60.0);",
    "  vec3 sun = vec3(1.0, 0.995, 0.97);",
    "  col += sun * spec * (0.10 + 2.4 * column) * (0.55 + 0.45 * crest);",
    "",
    "  // 더 잔물결의 미세 스페큘러 (촘촘한 작은 글린트)",
    "  vec2 pm = vec2(px * 8.0, py * 150.0 + flow * 2.4);",
    "  float my = noise(pm + vec2(0.0, e)) - noise(pm - vec2(0.0, e));",
    "  float mx = noise(pm + vec2(e * 2.0, 0.0)) - noise(pm - vec2(e * 2.0, 0.0));",
    "  vec3 n2 = normalize(vec3(-mx * 10.0, -my * 18.0, 1.0));",
    "  float spec2 = pow(max(dot(n2, H), 0.0), 120.0);",
    "  col += sun * spec2 * (0.05 + 1.0 * column);",
    "",
    "  // ---- 빛기둥 안의 부서지는 글리터 ----",
    "  float glit = smoothstep(0.52, 0.90, fbm2(vec2(px * 22.0, py * 60.0 - t * 1.6)));",
    "  col += sun * glit * column * (0.18 + 0.62 * glit);",
    "",
    "  // 빛기둥을 따라 흐르는 가로 대시 글린트",
    "  float dash = smoothstep(0.72, 0.985, noise(vec2(px * 24.0, py * 160.0 + flow * 3.0)));",
    "  col += sun * dash * column * 0.45;",
    "",
    "  // 기둥 전체의 은은한 물빛 번짐",
    "  col += vec3(0.10, 0.30, 0.40) * column * 0.26;",
    "",
    "  // ---- 기둥 밖으로 흩뿌려진 작은 반짝임 ----",
    "  float scat = smoothstep(0.82, 0.985, noise(vec2(px * 52.0, py * 104.0 - t * 2.4)));",
    "  col += sun * scat * 0.50 * (0.22 + 0.78 * smoothstep(0.0, 0.75, 1.0 - uv.y));",
    "  float scat2 = smoothstep(0.86, 0.995, noise(vec2(px * 108.0, py * 210.0 - t * 3.2)));",
    "  col += sun * scat2 * 0.45 * (0.20 + 0.80 * column);",
    "",
    "  // ---- 십자 별모양 스타버스트 글린트 ----",
    "  vec2 g = vec2(px * 28.0, py * 84.0);",
    "  vec2 id = floor(g);",
    "  vec2 f = fract(g) - 0.5;",
    "  float rnd = hash(id * 1.31 + 7.7);",
    "  vec2 off = vec2(hash(id + 13.1), hash(id + 5.7)) - 0.5;",
    "  vec2 d = f - off * 0.7;",
    "  float star = exp(-abs(d.x) * 24.0) * exp(-abs(d.y) * 7.0)",
    "             + exp(-abs(d.y) * 24.0) * exp(-abs(d.x) * 7.0);",
    "  float core = exp(-dot(d, d) * 110.0);",
    "  float mask = step(0.70, rnd) * (0.30 + 1.5 * column)",
    "             * (0.45 + 0.55 * smoothstep(0.0, 0.6, 1.0 - uv.y));",
    "  float tw = 0.55 + 0.45 * sin(t * 2.4 + rnd * 6.28);",
    "  col += sun * (star * 0.50 + core * 1.60) * mask * tw;",
    "",
    "  // 기둥 중심의 눈부신 코어 (순백색 윤슬 길)",
    "  col += sun * pow(column, 2.5) * 0.16;",
    "",
    "  gl_FragColor = vec4(col, 1.0);",
    "}"
  ].join("\n");

  var sea = document.getElementById("sea");
  var state = { gl: null, program: null, uniforms: {}, ctx2d: null, w: 0, h: 0, dpr: 1 };

  function compile(gl, type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      var log = gl.getShaderInfoLog(sh);
      gl.deleteShader(sh);
      throw new Error("shader: " + log);
    }
    return sh;
  }

  function initGL() {
    var attrs = { alpha: false, antialias: false, depth: false, stencil: false,
                  premultipliedAlpha: false, powerPreference: "low-power" };
    var gl = sea.getContext("webgl", attrs) || sea.getContext("experimental-webgl", attrs);
    if (!gl) { return false; }
    try {
      var vs = compile(gl, gl.VERTEX_SHADER, VERT);
      var fs = compile(gl, gl.FRAGMENT_SHADER, FRAG);
      var program = gl.createProgram();
      gl.attachShader(program, vs);
      gl.attachShader(program, fs);
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error("link: " + gl.getProgramInfoLog(program));
      }
      gl.useProgram(program);
      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      var loc = gl.getAttribLocation(program, "a_pos");
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      gl.disable(gl.DEPTH_TEST);
      gl.clearColor(0.024, 0.165, 0.290, 1.0);
      state.gl = gl;
      state.program = program;
      state.uniforms = {
        res: gl.getUniformLocation(program, "u_res"),
        time: gl.getUniformLocation(program, "u_time")
      };
      return true;
    } catch (err) {
      state.gl = null;
      state.program = null;
      return false;
    }
  }

  /* ---------- Canvas 2D 폴백: 가로 잔물결 + 중앙 윤슬 기둥 ---------- */
  var sparkSeed = [];
  for (var si = 0; si < 140; si++) {
    var centered = Math.random() < 0.62;
    sparkSeed.push({
      x: centered ? 0.5 + (Math.random() - 0.5) * 0.30 : Math.random(),
      y: Math.random(),
      p: Math.random() * 6.28,
      s: 0.5 + Math.random(),
      star: Math.random() < 0.35
    });
  }

  function draw2d(t) {
    var g = state.ctx2d;
    if (!g) { return; }
    var w = state.w, h = state.h;
    g.clearRect(0, 0, w, h);

    var grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, "#1d85b8");
    grad.addColorStop(0.34, "#0e5a8a");
    grad.addColorStop(1, "#072b4d");
    g.fillStyle = grad;
    g.fillRect(0, 0, w, h);

    // 가로 잔물결 (위는 촘촘, 아래는 넓게)
    for (var i = 0; i < 54; i++) {
      var fy = (i + 0.5) / 54;
      var y0 = Math.pow(fy, 0.62) * h;
      var amp = h * (0.004 + 0.012 * fy);
      var speed = 0.35 + fy * 0.5;
      g.beginPath();
      for (var x = 0; x <= w; x += Math.max(6, Math.round(w / 64))) {
        var u = x / w;
        var y = y0
          + Math.sin(u * 6.283 * (1.4 + fy) + t * speed + i) * amp
          + Math.sin(u * 6.283 * (3.1 + fy * 2.0) - t * speed * 1.6 + i * 0.7) * amp * 0.4;
        if (x === 0) { g.moveTo(x, y); } else { g.lineTo(x, y); }
      }
      g.strokeStyle = "rgba(168, 232, 250, " + (0.05 + 0.10 * (1 - fy)).toFixed(3) + ")";
      g.lineWidth = Math.max(1, (1.0 + fy * 1.6) * state.dpr * 0.7);
      g.stroke();
    }

    g.save();
    g.globalCompositeOperation = "lighter";

    // 중앙 윤슬 빛기둥
    var cw = w * 0.19;
    var cg = g.createLinearGradient(w * 0.5 - cw, 0, w * 0.5 + cw, 0);
    cg.addColorStop(0, "rgba(255,255,255,0)");
    cg.addColorStop(0.5, "rgba(210,245,255,0.16)");
    cg.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = cg;
    g.fillRect(0, 0, w, h);

    // 글린트
    for (var k = 0; k < sparkSeed.length; k++) {
      var sp = sparkSeed[k];
      var sx = sp.x * w;
      var sy = sp.y * h;
      var tw = 0.35 + 0.65 * Math.abs(Math.sin(t * 1.6 * sp.s + sp.p));
      var inCol = Math.max(0, 1 - Math.abs(sp.x - 0.5) / 0.26);
      var near = 1.0 - sp.y * 0.45;
      var r = (0.8 + 1.2 * sp.s) * state.dpr;
      g.fillStyle = "rgba(255,255,255," + (0.75 * tw * near * (0.35 + 0.65 * inCol)).toFixed(3) + ")";
      if (sp.star) {
        g.beginPath();
        g.ellipse(sx, sy, r * 2.4, r * 0.6, 0, 0, 6.283);
        g.fill();
        g.beginPath();
        g.ellipse(sx, sy, r * 0.6, r * 2.4, 0, 0, 6.283);
        g.fill();
      } else {
        g.beginPath();
        g.ellipse(sx, sy, r * 1.5, r * 0.8, -0.2, 0, 6.283);
        g.fill();
      }
    }
    g.restore();
  }

  function resizeSea() {
    var cssW = Math.max(1, Math.round(window.innerWidth));
    var cssH = Math.max(1, Math.round(window.innerHeight));
    state.dpr = Math.min(window.devicePixelRatio || 1, 2);
    var maxPixels = 820000;
    var scale = state.dpr;
    if (cssW * cssH * state.dpr * state.dpr > maxPixels) {
      scale = Math.max(1, Math.sqrt(maxPixels / (cssW * cssH)));
    }
    state.w = Math.round(cssW * scale);
    state.h = Math.round(cssH * scale);
    sea.width = state.w;
    sea.height = state.h;
    if (state.gl) { state.gl.viewport(0, 0, state.w, state.h); }
    if (state.ctx2d) {
      sea.width = Math.round(cssW * state.dpr);
      sea.height = Math.round(cssH * state.dpr);
      state.w = sea.width;
      state.h = sea.height;
      state.ctx2d.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    }
  }

  function drawSea(t) {
    if (state.gl && state.program) {
      state.gl.uniform2f(state.uniforms.res, state.w, state.h);
      state.gl.uniform1f(state.uniforms.time, Math.min(t, 100));
      state.gl.drawArrays(state.gl.TRIANGLES, 0, 3);
    } else {
      draw2d(t);
    }
  }

  /* ============================================================
     안내 문구 — 5초마다 부드러운 페이드 (1 → 2 → 3 → 4 → 5 → 1)
     ============================================================ */
  var msgEl = document.getElementById("msg");
  var msgIndex = 0;
  var msgTimer = 0;

  function showFirstMessage() {
    msgEl.textContent = MSGS[0];
    msgIndex = 1;
    msgEl.classList.remove("is-out");
  }

  function nextMessage() {
    msgEl.classList.add("is-out");
    window.setTimeout(function () {
      msgEl.textContent = MSGS[msgIndex];
      msgIndex = (msgIndex + 1) % MSGS.length;
      // 다음 프레임에서 opacity 를 되돌려야 전환이 실제로 보인다
      window.requestAnimationFrame(function () {
        msgEl.classList.remove("is-out");
      });
    }, MSG_FADE);
  }

  function startMessages() {
    stopMessages();
    showFirstMessage();
    msgTimer = window.setInterval(nextMessage, MSG_INTERVAL);
  }

  function stopMessages() {
    if (msgTimer) { window.clearInterval(msgTimer); msgTimer = 0; }
    if (msgEl) { msgEl.classList.remove("is-out"); }
  }

  /* ============================================================
     출렁이는 파도 로딩바 — 캡슐 트랙 안의 물결이 왼쪽→오른쪽으로 차오른다
     ============================================================ */
  var bar = document.getElementById("wave");
  var barCtx = bar ? bar.getContext("2d") : null;
  var barW = 0, barH = 0, barDpr = 1;

  var fillStart = 0;
  var finishing = false;
  var finishFrom = 0;
  var finishAt = 0;
  var progress = 0;

  function resizeBar() {
    if (!bar || !barCtx) { return; }
    var rect = bar.getBoundingClientRect();
    barDpr = Math.min(window.devicePixelRatio || 1, 2.5);
    var cssW = Math.max(1, rect.width || bar.clientWidth || 240);
    var cssH = Math.max(1, rect.height || bar.clientHeight || 15);
    bar.width = barW = Math.round(cssW * barDpr);
    bar.height = barH = Math.round(cssH * barDpr);
    barCtx.setTransform(1, 0, 0, 1, 0, 0);
  }

  function roundRect(g, x, y, w, h, r) {
    var rad = Math.max(0, Math.min(r, h / 2, w / 2));
    g.beginPath();
    g.moveTo(x + rad, y);
    g.lineTo(x + w - rad, y);
    g.arcTo(x + w, y, x + w, y + rad, rad);
    g.lineTo(x + w, y + h - rad);
    g.arcTo(x + w, y + h, x + w - rad, y + h, rad);
    g.lineTo(x + rad, y + h);
    g.arcTo(x, y + h, x, y + h - rad, rad);
    g.lineTo(x, y + rad);
    g.arcTo(x, y, x + rad, y, rad);
    g.closePath();
  }

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

  function currentProgress(now) {
    if (finishing) {
      var f = clamp01((now - finishAt) / FINISH_MS);
      return finishFrom + (1 - finishFrom) * f;
    }
    var u = clamp01((now - fillStart) / FILL_MS);
    // ease-out cubic: 처음엔 빠르게, 끝으로 갈수록 천천히 92%
    return FILL_MAX * (1 - Math.pow(1 - u, 3));
  }

  function drawBar(now, t) {
    if (!barCtx) { return; }
    var g = barCtx;
    var w = barW / barDpr;
    var h = barH / barDpr;
    var p = progress;
    g.setTransform(barDpr, 0, 0, barDpr, 0, 0);
    g.clearRect(0, 0, w, h);

    var r = h / 2;

    // 트랙 (캡슐형 유리 홈)
    g.save();
    roundRect(g, 0.5, 0.5, w - 1, h - 1, r - 0.5);
    g.fillStyle = "rgba(6, 28, 44, 0.46)";
    g.fill();
    g.strokeStyle = "rgba(180, 226, 248, 0.30)";
    g.lineWidth = 1;
    g.stroke();
    g.restore();

    // 물이 차오르는 영역만 남기고 캡슐 모양으로 자른다
    var inset = 1.6;
    g.save();
    roundRect(g, inset, inset, w - inset * 2, h - inset * 2, Math.max(0, r - inset));
    g.clip();

    var fillW = p * w;
    if (fillW > 0.3) {
      var amp = h * 0.20;
      var surface = h * 0.26;
      var phase = t * 2.1;
      var step = 1.6;

      // 물결 윗면 + 물 채우기
      g.beginPath();
      g.moveTo(-8, h + 8);
      for (var x = -8; x <= fillW + 8; x += step) {
        var y = surface
          + Math.sin(x / (h * 1.9) + phase) * amp
          + Math.sin(x / (h * 0.95) - phase * 1.45) * amp * 0.45;
        g.lineTo(x, y);
      }
      g.lineTo(fillW + 8, h + 8);
      g.closePath();

      var wg = g.createLinearGradient(0, 0, 0, h);
      wg.addColorStop(0, "#8ff6ea");
      wg.addColorStop(0.45, "#39e6d0");
      wg.addColorStop(1, "#38b6ff");
      g.fillStyle = wg;
      g.fill();

      // 물결 마루의 밝은 물빛 선
      g.beginPath();
      for (var x2 = -8; x2 <= fillW + 8; x2 += step) {
        var y2 = surface
          + Math.sin(x2 / (h * 1.9) + phase) * amp
          + Math.sin(x2 / (h * 0.95) - phase * 1.45) * amp * 0.45;
        if (x2 === -8) { g.moveTo(x2, y2); } else { g.lineTo(x2, y2); }
      }
      g.strokeStyle = "rgba(232, 255, 252, 0.92)";
      g.lineWidth = 1.6;
      g.stroke();

      // 차오르는 앞머리(물기둥)를 부드럽게
      var edge = g.createLinearGradient(fillW - h * 1.4, 0, fillW + 1, 0);
      edge.addColorStop(0, "rgba(255,255,255,0)");
      edge.addColorStop(1, "rgba(255,255,255,0.35)");
      g.fillStyle = edge;
      g.fillRect(Math.max(0, fillW - h * 1.4), 0, h * 1.4 + 1, h);

      // 흐르는 윤슬 광택
      var sheenX = ((t * 0.30) % 1.6 - 0.3) * w;
      var sg = g.createLinearGradient(sheenX, 0, sheenX + w * 0.28, 0);
      sg.addColorStop(0, "rgba(255,255,255,0)");
      sg.addColorStop(0.5, "rgba(255,255,255,0.22)");
      sg.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = sg;
      g.fillRect(Math.max(0, sheenX), 0, Math.min(w * 0.28, Math.max(0, fillW - sheenX)), h);
    }
    g.restore();

    // 캡슐 안쪽 테두리 하이라이트
    g.save();
    roundRect(g, inset, inset, w - inset * 2, h - inset * 2, Math.max(0, r - inset));
    g.strokeStyle = "rgba(255,255,255,0.14)";
    g.lineWidth = 1;
    g.stroke();
    g.restore();
  }

  /* ============================================================
     메인 루프
     ============================================================ */
  var rafId = 0;
  var t0 = 0;
  var running = false;

  function loop(now) {
    if (!running) { return; }
    if (!t0) { t0 = now; }
    var t = (now - t0) / 1000;
    progress = currentProgress(now);
    drawSea(t);
    drawBar(now, t);
    rafId = window.requestAnimationFrame(loop);
  }

  function start() {
    if (!state.gl) {
      if (!initGL()) {
        state.ctx2d = sea.getContext("2d");
        if (state.ctx2d) { sea.setAttribute("data-fallback", "2d"); }
      }
    }
    resizeSea();
    resizeBar();
    fillStart = performance.now();
    finishing = false;
    finishFrom = 0;
    progress = 0;
    startMessages();
    if (!running) {
      running = true;
      t0 = 0;
      rafId = window.requestAnimationFrame(loop);
    }
  }

  function stop() {
    running = false;
    if (rafId) { window.cancelAnimationFrame(rafId); rafId = 0; }
    stopMessages();
  }

  window.addEventListener("resize", function () {
    resizeSea();
    resizeBar();
  });
  window.addEventListener("orientationchange", function () {
    window.setTimeout(function () { resizeSea(); resizeBar(); }, 180);
  });

  // WebGL 컨텍스트를 잃으면 Canvas 2D 폴백으로 넘어간다
  sea.addEventListener("webglcontextlost", function (e) {
    e.preventDefault();
    state.gl = null;
    state.program = null;
    if (!state.ctx2d) {
      // 한 번 잃은 캔버스는 다시 GL 을 주지 않으므로 2D 로 그린다
      state.ctx2d = sea.getContext("2d");
      resizeSea();
    }
  }, false);

  /* ---------- 네이티브(MainActivity)에서 호출하는 API ---------- */
  window.finishLoading = function () {
    if (finishing) { return true; }
    finishing = true;
    finishFrom = progress;
    finishAt = performance.now();
    return true;
  };

  window.restartLoading = function () {
    stop();
    start();
    return true;
  };

  window.stopLoadingAnimation = function () {
    stop();
    return true;
  };

  window.getLoadingProgress = function () { return progress; };

  window.getLoadingState = function () {
    return {
      progress: progress,
      elapsedMs: Math.max(0, performance.now() - fillStart),
      finishing: finishing,
      messageIndex: (msgIndex - 1 + MSGS.length) % MSGS.length,
      message: msgEl ? msgEl.textContent : "",
      webgl: !!(state.gl && state.program)
    };
  };

  start();
})();
</script>
</body>
</html>
