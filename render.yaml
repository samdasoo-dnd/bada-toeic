# Render.com 무료 웹서비스 배포 설정 (Docker)
#   New + > Blueprint > 이 저장소 선택 → 자동 배포
services:
  - type: web
    name: bada-toeic
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
